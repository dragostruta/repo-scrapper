services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-codedocs}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-codedocs}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-codedocs}?schema=public
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-1024}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      MODEL_CACHE_DIR: /data/models
      WORKSPACE_DIR: /data/repos
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      CONTEXT_TOKEN_BUDGET: ${CONTEXT_TOKEN_BUDGET:-4000}
      KEYWORD_BOOST: ${KEYWORD_BOOST:-0.15}
      MAX_REPO_SIZE_MB: ${MAX_REPO_SIZE_MB:-200}
      MAX_FILES: ${MAX_FILES:-5000}
      MAX_FILE_SIZE_KB: ${MAX_FILE_SIZE_KB:-512}
      CLONE_TIMEOUT_MS: ${CLONE_TIMEOUT_MS:-120000}
      ALLOWED_REPO_HOSTS: ${ALLOWED_REPO_HOSTS:-github.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3001:3001'
    volumes:
      - models:/data/models
      - repos:/data/repos
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'

  # Optional: run the LLM fully in Docker too, with no local install.
  # Off by default - `docker compose --profile local-llm up` to include it,
  # then set LLM_PROVIDER=ollama and OLLAMA_BASE_URL=http://ollama:11434 in
  # .env. On Apple Silicon this is CPU-only (Docker Desktop's Linux VM has no
  # Metal access), noticeably slower than running Ollama natively via brew.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ['local-llm']
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # `ollama list` talks to this container's own server over its default
      # localhost:11434 - succeeds once it's actually accepting requests, no
      # curl/wget dependency needed in the image.
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: pulls the model into the `ollama` named volume and exits. Only
  # runs with the local-llm profile, same as `ollama` itself - see
  # scripts/setup.sh and scripts/switch-llm.sh, which are what actually
  # invoke `docker compose --profile local-llm up`. `api` is not wired to
  # depend on this finishing (that would force every profile-less `docker
  # compose up` to require it); OllamaProvider already gives a clear "is the
  # model pulled?" error if a question arrives before this completes.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ['local-llm']
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['ollama', 'pull', '${OLLAMA_MODEL:-qwen2.5-coder:7b}']

volumes:
  pgdata:
  models:
  repos:
  ollama:
